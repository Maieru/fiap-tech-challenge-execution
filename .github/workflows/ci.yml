name: Execution CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: execution-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery:
    name: Verify delivery tooling
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts/delivery --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix scripts/delivery
  verify:
    # MongoDB 8 has kernel restrictions; see the CI diagnostics guide in the main repository.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      TESTCONTAINERS_WAIT_STRATEGY_TIMEOUT: '00:02:00'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Runner and Docker diagnostics
        run: |
          uname -r
          docker version
          docker info --format 'Docker host kernel: {{.KernelVersion}}'
      - name: Pull integration dependencies
        timeout-minutes: 5
        run: |
          docker pull mongo:8.0
          docker pull confluentinc/cp-kafka:7.9.2
      - name: Build
        run: dotnet build Execution.slnx -c Release
      - name: Test with coverage
        timeout-minutes: 8
        run: >-
          dotnet test Execution.slnx -c Release --no-build --no-restore
          --filter 'TestCategory!=ContainerImage' --settings coverage.runsettings
          --collect:'XPlat Code Coverage;Format=cobertura,opencover'
          --logger 'console;verbosity=normal' --logger trx
          --blame-hang-timeout 3m --results-directory artifacts/test-results
      - name: Install coverage tool
        run: dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.12 --tool-path "$RUNNER_TEMP/reportgenerator"
      - name: Require 80 percent coverage
        run: |
          "$RUNNER_TEMP/reportgenerator/reportgenerator" \
            '-reports:artifacts/test-results/**/coverage.cobertura.xml' \
            '-targetdir:artifacts/coverage' '-reporttypes:JsonSummary;Cobertura;MarkdownSummaryGithub' \
            '-assemblyfilters:+FIAP.TechChallenge.Execution.*;-*.Tests*' \
            '--minimumCoverageThresholds:lineCoverage=80'
          jq -e '.summary.coverablelines > 0' artifacts/coverage/Summary.json
          cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build image
        run: docker build -f Dockerfile -t fiap-execution:ci .
      - name: Verify image and export OpenAPI
        timeout-minutes: 6
        env:
          EXECUTION_TEST_IMAGE: fiap-execution:ci
          EXECUTION_OPENAPI_OUTPUT: ${{ github.workspace }}/artifacts/execution-openapi.json
        run: >-
          dotnet test tests/FIAP.TechChallenge.Execution.Integration.Tests -c Release --no-build --no-restore
          --filter 'TestCategory=ContainerImage' --logger 'console;verbosity=normal' --logger trx
          --blame-hang-timeout 3m --results-directory artifacts/image-tests
      - name: Pack contracts
        run: dotnet pack src/FIAP.TechChallenge.Execution.Application.Messaging -c Release --no-build -o artifacts/packages "-p:PackageVersion=0.1.0-ci.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
      - name: Container diagnostics on failure
        if: failure()
        timeout-minutes: 2
        run: |
          docker ps -a --no-trunc
          for container in $(docker ps -aq --filter label=org.testcontainers=true); do
            docker inspect --format '{{.Name}}: {{json .State}}' "$container" || true
            docker logs --tail 80 "$container" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-verification
          path: |
            artifacts/test-results/
            artifacts/image-tests/
            artifacts/coverage/
            artifacts/packages/
            artifacts/execution-openapi.json
  quality:
    needs: verify
    uses: ./.github/workflows/sonarqube.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  ci-required:
    if: always()
    needs: [verify, quality, delivery]
    runs-on: ubuntu-latest
    steps:
      - name: Require verification and quality
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DELIVERY_RESULT: ${{ needs.delivery.result }}
        run: test "$VERIFY_RESULT" = success && test "$QUALITY_RESULT" = success && test "$DELIVERY_RESULT" = success
