services:
  os-database:
    image: postgres:18.3
    environment:
      POSTGRES_DB: fiap_os
      POSTGRES_USER: fiap_os
      POSTGRES_PASSWORD: ${OS_DB_PASSWORD:?Preencha OS_DB_PASSWORD}
    volumes:
      - os_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fiap_os -d fiap_os"]
      interval: 5s
      retries: 20
  os-api:
    image: ${OS_IMAGE:-fiap-os:local}
    ports:
      - "127.0.0.1:${OS_HTTP_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=os-database;Database=fiap_os;Username=fiap_os;Password=${OS_DB_PASSWORD:?Preencha OS_DB_PASSWORD}
      Database__ApplyMigrations: "true"
      Kafka__BootstrapServers: kafka:9092
      Jwt__Issuer: ${JWT_ISSUER:?Preencha JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE:?Preencha JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Preencha JWT_SIGNING_KEY}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      Observability__EnableOtlp: ${EXECUTION_ENABLE_OTLP:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
    depends_on:
      os-database:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: "no"
  billing-database:
    image: postgres:18.3
    environment:
      POSTGRES_DB: fiap_billing
      POSTGRES_USER: fiap_billing
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:?Preencha BILLING_DB_PASSWORD}
    volumes:
      - billing_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiap_billing -d fiap_billing"]
      interval: 5s
      retries: 20
  billing-api:
    image: ${BILLING_IMAGE:-fiap-billing:local}
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      MercadoPago__AccessToken: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MercadoPago__WebhookSecret: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: Host=billing-database;Database=fiap_billing;Username=fiap_billing;Password=${BILLING_DB_PASSWORD:?Preencha BILLING_DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
      Jwt__Issuer: ${JWT_ISSUER:?Preencha JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE:?Preencha JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Preencha JWT_SIGNING_KEY}
    depends_on:
      billing-database:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: "no"
volumes:
  billing_postgres_data:
  os_postgres_data:
