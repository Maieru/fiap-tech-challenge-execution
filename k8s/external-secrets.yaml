apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fiap-execution-database-credentials
  namespace: fiap-execution
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: fiap-execution-database-credentials
    creationPolicy: Owner
  # Importar apenas a connection string deste banco, nunca o segredo do legado.
  data:
    - secretKey: Mongo__ConnectionString
      remoteRef:
        key: fiap-execution-database-credentials
        property: Mongo__ConnectionString
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fiap-execution-jwt-signing-key
  namespace: fiap-execution
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: fiap-execution-jwt-signing-key
    creationPolicy: Owner
  data:
    - secretKey: Jwt__SigningKey
      remoteRef:
        key: fiap-secret-manager-jwt-signing-key
        property: Jwt__SigningKey
